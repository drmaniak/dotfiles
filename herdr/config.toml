onboarding = false

# New panes/tabs open in the focused pane's directory (tmux: split-window -c "#{pane_current_path}")
[terminal]
new_cwd = "follow"

[theme]
name = "kanagawa"
auto_switch = false

[ui]
show_agent_labels_on_pane_borders = true
mouse_capture = true          # tmux: set -g mouse on

[ui.toast]
delivery = "terminal"

# ---------------------------------------------------------------------------
# Keybindings — ported from ~/.config/tmux/tmux.conf
# ---------------------------------------------------------------------------
[keys]
prefix = "ctrl+a"             # tmux: set -g prefix C-a (unbind C-b)

reload_config = "prefix+r"    # tmux: bind r source-file ...
resize_mode   = "prefix+shift+r"  # moved off prefix+r (herdr default) to free it for reload

# Vim-style pane focus (tmux: bind -r h/j/k/l select-pane). These are herdr
# defaults, listed here for clarity. Ctrl+h/j/k/l seamless nav is handled by
# the vim-herdr-navigation plugin below.
focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"

# Splits (tmux: bind - split-window / bind | split-window -h)
split_horizontal = "prefix+minus"   # stacked, matches tmux `-`
split_vertical   = "prefix+|"       # side-by-side, matches tmux `|`
                                    # if your terminal doesn't pass shift+\, use "prefix+backslash" or "prefix+v"

# ---------------------------------------------------------------------------
# vim-tmux-navigator, ported to herdr (plugin: paulbkim-dev/vim-herdr-navigation)
# Seamless Ctrl+h/j/k/l across herdr panes and Vim/Neovim splits.
# Requires the plugin to be installed (see setup notes).
# ---------------------------------------------------------------------------
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

# Clear screen — ctrl+l is taken over by pane navigation above, so send a
# literal ctrl+l to the focused pane. tmux: bind C-l send-keys 'C-l'
[[keys.command]]
key = "prefix+ctrl+l"
type = "shell"
command = 'herdr pane send-keys "$HERDR_ACTIVE_PANE_ID" ctrl+l'
description = "clear screen (send ctrl+l to pane)"
